syntax = "proto3";

// Mensaje con campo "timestamp" (en segundos) + datos de sensor.
// Usar con el parser_protobuf, checkbox "Use embedded timestamp field" activado,
// campo nombre vacío (fallback automático a "timestamp").
message SensorReading {
  double timestamp = 1;   // segundos desde epoch
  double temperature = 2; // ºC
  double pressure    = 3; // hPa
  double humidity    = 4; // %
}
