syntax = "proto3";

package pj.common;

// Lives in a subdirectory to test include folders.

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Quaternion {
  double w = 1;
  double x = 2;
  double y = 3;
  double z = 4;
}

message Header {
  double timestamp = 1;  // seconds
  string frame_id = 2;
  uint32 seq = 3;
}
