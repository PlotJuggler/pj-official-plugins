syntax = "proto3";

package pj.test;

// Resolving this import needs test_scripts/ added as an include folder in PlotJuggler.
import "common/types.proto";

message RobotPose {
  // header.timestamp is read by use_embedded_timestamp
  pj.common.Header header = 1;
  pj.common.Vector3 position = 2;
  pj.common.Quaternion orientation = 3;
  pj.common.Vector3 linear_velocity = 4;
  pj.common.Vector3 angular_velocity = 5;
  string robot_name = 6;
  bool is_moving = 7;
  double battery_level = 8;
}
