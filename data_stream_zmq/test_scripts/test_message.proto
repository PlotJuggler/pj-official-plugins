syntax = "proto3";

package pj.test;

message TestMessage {
  // Seconds; read by use_embedded_timestamp. Left unset to test the without-timestamp case.
  double timestamp = 1;
  double value_sin = 2;
  double value_cos = 3;
  int32 counter = 4;
  SensorData sensors = 5;
}

message SensorData {
  double temperature = 1;
  double pressure = 2;
  double humidity = 3;
}
