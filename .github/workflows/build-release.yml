name: Build & Release

on:
  workflow_dispatch:
  push:
    tags: ['*/v*']
  schedule:
    # Keep the full-build Conan cache warm — runs weekly (cache expires after 7 days of no access)
    - cron: '0 3 * * 1'  # Monday 3am UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-feature-floor:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout the build ref
        uses: actions/checkout@v4
        with:
          # On a tag event this pins the scan to the exact tree that the build
          # and release jobs will publish, including lightweight tags.
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve build scope
        id: build-scope
        shell: bash
        run: |
          python3 scripts/release_tools.py resolve-build-scope \
            --tag "${GITHUB_REF_NAME:-}" \
            --tag-type "${GITHUB_REF_TYPE:-}" \
            --os-label linux \
            --arch x86_64 \
            >> "${GITHUB_OUTPUT}"

      - name: Check SDK feature-floor declarations
        shell: bash
        run: |
          PLUGIN="${{ steps.build-scope.outputs.plugin_name }}"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && -z "${PLUGIN}" ]]; then
            echo "::error::Tag build did not resolve a plugin source directory"
            exit 1
          fi
          if [[ -n "${PLUGIN}" ]]; then
            python3 scripts/check_sdk_feature_floors.py "${PLUGIN}"
          else
            python3 scripts/check_sdk_feature_floors.py
          fi

  build:
    needs: sdk-feature-floor
    runs-on: ${{ matrix.runner }}
    # Without an explicit bound these inherit GitHub's 360-minute default, so a
    # wedged build burns six hours per leg before anyone notices.
    #
    # 120 rather than 60: with a warm cache a leg takes 1-16 minutes, but a cold
    # cache whose binaries are also missing from the JFrog remote means compiling
    # the whole closure. toolbox_mosaico 1.1.0 built Arrow+Flight from source in
    # 65m21s on windows-2022 and SUCCEEDED -- a 60-minute cap would have killed it.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            os_label: linux
            lib_ext: so
          - runner: ubuntu-22.04-arm
            arch: aarch64
            os_label: linux
            lib_ext: so
          # macOS x86_64 is intentionally absent: Intel Macs are not a supported
          # target for the time being. The runners are also the scarcest and
          # slowest in the matrix (15-25 min builds vs ~40 s on macos-14).
          - runner: macos-14
            arch: arm64
            os_label: macos
            lib_ext: dylib
          # Pinned to windows-2022: see ci-windows.yml — the VS18/MSVC 14.5x image
          # breaks the libsodium/1.0.20 build (MSB8052, toolset 14.44 vs v145).
          # windows-11-arm below is left as-is (the failure is x64-toolset-specific).
          - runner: windows-2022
            arch: x64
            os_label: windows
            lib_ext: dll
          - runner: windows-11-arm
            arch: arm64
            os_label: windows
            lib_ext: dll

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build scope
        id: build-scope
        shell: bash
        run: |
          python3 scripts/release_tools.py resolve-build-scope \
            --tag "${GITHUB_REF_NAME:-}" \
            --tag-type "${GITHUB_REF_TYPE:-}" \
            --os-label "${{ matrix.os_label }}" \
            --arch "${{ matrix.arch }}" \
            >> "${GITHUB_OUTPUT}"

      - name: Install Conan
        id: setup-conan
        uses: conan-io/setup-conan@v1.3.0

      - name: Restore Conan package cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup-conan.outputs.conan-home }}/p
          key: conan-${{ steps.setup-conan.outputs.conan-version }}-${{ runner.os }}-${{ matrix.arch }}-${{ steps.build-scope.outputs.scope }}-${{ steps.build-scope.outputs.conan_hash }}
          restore-keys: |
            conan-${{ steps.setup-conan.outputs.conan-version }}-${{ runner.os }}-${{ matrix.arch }}-${{ steps.build-scope.outputs.scope }}-

      - name: Install cmake and ninja
        # ninja 1.13.0 corrupts MSVC link response files (leading chars of
        # >16,383-char rsp lines stripped -> LNK1181); pin the last good
        # release on PyPI (1.12.x was never published there) — ninja-build/ninja#2616
        run: pip install cmake "ninja==1.11.1.4"

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows' && steps.build-scope.outputs.skip != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Detect Conan profile
        if: steps.build-scope.outputs.skip != 'true'
        shell: bash
        run: conan profile detect --force

      - name: Configure PlotJuggler JFrog Conan remote
        if: steps.build-scope.outputs.skip != 'true' && github.repository == 'PlotJuggler/pj-official-plugins'
        env:
          JFROG_USER: ${{ vars.JFROG_USER || secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        shell: bash
        run: scripts/configure_jfrog_conan.sh

      - name: Acquire plotjuggler_sdk (JFrog → source fallback)
        if: steps.build-scope.outputs.skip != 'true'
        shell: bash
        run: scripts/ensure_core.sh

      - name: Build & Test
        if: steps.build-scope.outputs.skip != 'true'
        shell: bash
        run: |
          if [[ "${{ steps.build-scope.outputs.use_release_override }}" == "true" ]]; then
            "./${{ steps.build-scope.outputs.plugin_name }}/release.sh"
          else
            ./build.sh ${{ steps.build-scope.outputs.build_script_args }}
            ctest --test-dir "${{ steps.build-scope.outputs.build_dir }}" -V --output-on-failure
          fi

      - name: Upload built Conan binaries to JFrog
        # Publish every dependency compiled above (and the SDK if ensure_core.sh
        # built it from source) so the next tag / weekly run on this
        # platform fetches them prebuilt. This matrix is the ONLY producer of
        # linux-aarch64, windows-x64/arm64 and macos-arm64 release binaries: the
        # CI workflows prime JFrog for linux-x86_64 and macos only, so without
        # this step every cold release leg recompiled Arrow/gRPC/cpython from
        # source (40 min on ubuntu-22.04-arm, 77 min on windows-2022). Idempotent:
        # Conan skips revisions already on the remote, and the script is a no-op
        # when the remote was not configured (fork, missing secrets, outage).
        if: steps.build-scope.outputs.skip != 'true' && github.repository == 'PlotJuggler/pj-official-plugins'
        shell: bash
        run: scripts/upload_conan_artifacts.sh

      - name: Verify plugin version
        if: startsWith(github.ref, 'refs/tags/') && steps.build-scope.outputs.skip != 'true'
        shell: bash
        run: |
          python3 scripts/release_tools.py verify-version-consistency \
            --release-tag "${{ github.ref_name }}" \
            --build-dir "${{ steps.build-scope.outputs.build_dir }}" \
            --check-manifest

      - name: Package artifacts
        if: startsWith(github.ref, 'refs/tags/') && steps.build-scope.outputs.skip != 'true'
        shell: bash
        run: |
          ZIP_NAME=$(python3 scripts/release_tools.py create-distribution-package \
            --release-tag "${{ github.ref_name }}" \
            --build-dir "${{ steps.build-scope.outputs.build_dir }}" \
            --output-dir dist \
            --os-label "${{ matrix.os_label }}" \
            --arch "${{ matrix.arch }}")

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Compress artifacts (Linux/macOS)
        if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Windows' && steps.build-scope.outputs.skip != 'true'
        shell: bash
        run: cd dist && zip -r "../${{ env.ZIP_NAME }}" .

      - name: Compress artifacts (Windows)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows' && steps.build-scope.outputs.skip != 'true'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath "$env:ZIP_NAME"
          Write-Host "Package created: $env:ZIP_NAME"

      - name: Generate checksum (Linux/macOS)
        if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Windows' && steps.build-scope.outputs.skip != 'true'
        shell: bash
        run: |
          if command -v sha256sum &> /dev/null; then
            sha256sum "${{ env.ZIP_NAME }}" > "${{ env.ZIP_NAME }}.sha256"
          else
            shasum -a 256 "${{ env.ZIP_NAME }}" > "${{ env.ZIP_NAME }}.sha256"
          fi
          cat "${{ env.ZIP_NAME }}.sha256"

      - name: Generate checksum (Windows)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows' && steps.build-scope.outputs.skip != 'true'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "$env:ZIP_NAME").Hash.ToLower()
          "$hash  $env:ZIP_NAME" | Out-File -Encoding ascii "$env:ZIP_NAME.sha256"
          Get-Content "$env:ZIP_NAME.sha256"

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/') && steps.build-scope.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/') && matrix.runner == 'ubuntu-22.04' && steps.build-scope.outputs.skip != 'true'
        shell: bash
        run: |
          git fetch --tags --force --unshallow || git fetch --tags --force
          python3 scripts/release_tools.py generate-release-notes \
            --release-tag "${{ github.ref_name }}" \
            --output release-notes.md

      - name: Upload to Release with notes
        if: startsWith(github.ref, 'refs/tags/') && matrix.runner == 'ubuntu-22.04' && steps.build-scope.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
          body_path: release-notes.md
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.runner != 'ubuntu-22.04' && steps.build-scope.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Submit to registry if tag metadata requests it
  submit-to-registry:
    needs: build
    if: success() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for tag annotations

      - name: Fetch tags with annotations
        run: git fetch --tags --force

      - name: Check tag metadata
        id: check-tag
        run: |
          # Get tag annotation message (contains JSON metadata)
          # Use git cat-file to reliably get the tag message for annotated tags
          TAG_SHA=$(git rev-parse "refs/tags/${{ github.ref_name }}")
          TAG_TYPE=$(git cat-file -t "$TAG_SHA")

          if [ "$TAG_TYPE" = "tag" ]; then
            # Annotated tag - extract message (skip header lines, get body)
            TAG_MSG=$(git cat-file -p "$TAG_SHA" | sed -n '/^$/,$p' | tail -n +2)
          else
            # Lightweight tag - no message
            TAG_MSG="{}"
          fi

          echo "Tag type: $TAG_TYPE"
          echo "Tag message: $TAG_MSG"

          # Parse auto_submit_to_registry from JSON
          AUTO_SUBMIT=$(echo "$TAG_MSG" | python3 -c "import sys,json; d=json.loads(sys.stdin.read() or '{}'); print(str(d.get('auto_submit_to_registry', False)).lower())")
          echo "auto_submit=$AUTO_SUBMIT" >> $GITHUB_OUTPUT
          echo "Auto-submit to registry: $AUTO_SUBMIT"

      - name: Submit to registry
        if: steps.check-tag.outputs.auto_submit == 'true'
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_PAT }}
        run: |
          # Extract source_dir from tag (data_load_csv/v1.0.5 -> data_load_csv)
          SOURCE_DIR="${GITHUB_REF_NAME%/*}"
          VERSION="${GITHUB_REF_NAME#*/v}"
          python3 scripts/release_tools.py generate-release-notes \
            --release-tag "${GITHUB_REF_NAME}" \
            --output release-notes.md
          echo "Submitting $SOURCE_DIR v$VERSION to registry..."
          python3 scripts/submit_to_registry.py "$SOURCE_DIR" \
            --version "$VERSION" \
            --release-notes release-notes.md \
            --skip-checksum-verify
