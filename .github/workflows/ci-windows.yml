name: CI Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: windows-latest migrated to the VS18/MSVC 14.5x image, where the
    # libsodium/1.0.20 Conan recipe fails to build from source (MSB8052: default
    # toolset 14.44 is incompatible with the v145 platform toolset its bundled
    # vs2022 solution selects). windows-2022 is the last known-green image.
    # Revert to windows-latest once libsodium's recipe supports v145 or we move
    # off the 1.0.20 pin. See follow-up infra issue.
    runs-on: windows-2022
    # Backstop against hangs (a deadlocked build otherwise holds the runner for
    # GitHub's 6-hour default). A cold run still rebuilds the whole Conan
    # closure from source before the cache save persists it; keep margin for
    # that bootstrap case.
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Conan
        uses: conan-io/setup-conan@v1.3.0
        with:
          # Binaries come from the explicitly keyed Actions cache below, with
          # ConanCenter source builds as the fallback. Do not also archive
          # ~/.conan2 through setup-conan's own coarse cache: it is keyed per
          # workflow, not per dependency graph, so it both misses after any
          # change and re-saves multi-GB archives it just restored.
          cache_packages: false

      - name: Install cmake and ninja
        # ninja 1.13.0 corrupts MSVC link response files: any rsp line over
        # 16,383 chars has its leading characters stripped, so link.exe fails
        # with LNK1181 on a truncated path of the line's first token (the
        # object list + library line of every multi-object target). Pin the
        # last good release — https://github.com/ninja-build/ninja/issues/2616
        run: pip install cmake "ninja==1.11.1.4"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compute Conan cache key
        id: conan_cache_key
        shell: pwsh
        run: |
          # The runner is pinned to windows-2022 above, so this identity maps
          # to one stable MSVC/Release dependency graph. Key inputs: the root
          # conanfile.py (the whole third-party closure) and SDK_VERSION (the
          # plotjuggler_sdk package ensure_core.sh builds into the same cache).
          # Bump $cacheVersion to force a cold rebuild.
          $cacheVersion = "v1"
          $combined = (Get-FileHash conanfile.py -Algorithm SHA256).Hash + (Get-FileHash SDK_VERSION -Algorithm SHA256).Hash
          $stream = [System.IO.MemoryStream]::new([System.Text.Encoding]::UTF8.GetBytes($combined))
          $fileHash = (Get-FileHash -InputStream $stream -Algorithm SHA256).Hash.Substring(0, 16).ToLower()
          "key=conan-windows-msvc-release-$cacheVersion-$fileHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "restore_prefix=conan-windows-msvc-release-$cacheVersion-" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore Conan cache
        # PR runs can restore caches published by main (base-branch sharing),
        # so only the first run after a dependency change pays the full
        # from-source build. Prefix fallback: an older closure for the same
        # toolchain still seeds most packages, so only changed deps rebuild.
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2
          key: ${{ steps.conan_cache_key.outputs.key }}
          restore-keys: |
            ${{ steps.conan_cache_key.outputs.restore_prefix }}

      - name: Install sccache
        # Compile-cache speedup for the plugin compilation itself (the Conan
        # dependency closure is covered by the cache above), NOT load-bearing:
        # the build is correct without it, just slower. Backend: GitHub
        # Actions cache (SCCACHE_GHA_ENABLED below). The outcome gate in
        # Build & Test keeps this optional if installation flakes.
        id: setup_sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"

      - name: Configure PlotJuggler JFrog Conan remote
        # Second-tier binary source behind the keyed Actions cache above: on a
        # cache miss (dependency change, SDK bump, or eviction -- this repo sits
        # at the 10 GB Actions cache limit) `conan install --build=missing` pulls
        # MSVC binaries the release workflow already published instead of
        # recompiling Arrow/boost/gRPC. Push-only: PR runs get no secrets, and
        # configure_jfrog_conan.sh degrades to ConanCenter when anything fails.
        # The login token is purged again before ~/.conan2 is saved (see Trim).
        if: github.event_name != 'pull_request' && github.repository == 'PlotJuggler/pj-official-plugins'
        env:
          JFROG_USER: ${{ vars.JFROG_USER || secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        shell: bash
        run: scripts/configure_jfrog_conan.sh

      - name: Acquire plotjuggler_sdk
        # Warm run: the SDK is in the restored cache and ensure_core.sh exits
        # immediately. Cache miss: prefer a prebuilt binary from JFrog (push
        # runs), otherwise build the pinned submodule from source into ~/.conan2.
        shell: bash
        run: |
          conan profile detect --force
          scripts/ensure_core.sh

      - name: Build & Test
        shell: bash
        env:
          SCCACHE_GHA_ENABLED: "on"
          SCCACHE_AVAILABLE: ${{ steps.setup_sccache.outcome == 'success' }}
        run: |
          # -s:b compiler.cppstd=20: the root recipe's protobuf tool_requires lives
          # in the BUILD context. protobuf 6.x needs C++17, but MSVC's default build
          # profile is cppstd=14, so its validate() rejects the package. Host -s only
          # covers the host context.
          conan install . --output-folder=build --build=missing -s build_type=Release \
            -s compiler.cppstd=20 -s:b compiler.cppstd=20 \
            -c tools.cmake.cmaketoolchain:generator=Ninja \
            -o "cpython/*:shared=True"

          # Route the plugin compile through sccache only when its install
          # succeeded; otherwise degrade to an uncached (but correct) build.
          # The launcher is honored by the Ninja generator (MSBuild would
          # silently ignore it).
          launcher_args=()
          if [[ "$SCCACHE_AVAILABLE" == "true" ]]; then
            launcher_args=(-DCMAKE_C_COMPILER_LAUNCHER=sccache \
                           -DCMAKE_CXX_COMPILER_LAUNCHER=sccache)
          else
            echo "::warning::sccache unavailable; building without a compiler cache"
          fi

          cmake -S . -B build/Release -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake \
            -DCMAKE_PREFIX_PATH=build \
            -DCMAKE_BUILD_TYPE=Release \
            "${launcher_args[@]}"
          cmake --build build/Release --config Release

          # Surface sccache stats next to the compile output.
          if [[ "$SCCACHE_AVAILABLE" == "true" ]]; then
            sccache --show-stats
          fi

          ctest --test-dir build/Release -V --output-on-failure

      - name: Build & Test plugins outside the aggregate
        # The aggregate root recipe above leaves out the plugins whose dependency
        # pins clash with the Arrow/Flight stack, so this job never compiled them and
        # a green Windows check said nothing about them. That is not hypothetical: the
        # macOS fix for data_stream_lsl (#256) merged with all 34 checks green, then
        # broke both Windows legs of the very next release -- because liblsl is one of
        # those plugins and no Windows job had ever built it.
        #
        # Same discovery rule and rationale as the step added to ci-macos.yml in #256
        # (own conanfile.py + manifest.json, no release.sh), and ci-linux.yml already
        # covers this through its discover-plugins matrix. Run in this job so the legs
        # reuse the Conan cache the aggregate just warmed.
        shell: bash
        env:
          SCCACHE_GHA_ENABLED: "on"
        run: |
          for d in */conanfile.py; do
            plugin=$(dirname "$d")
            [[ -f "$plugin/release.sh" ]] && continue
            [[ -f "$plugin/manifest.json" ]] || continue
            grep -q "add_subdirectory($plugin)" CMakeLists.txt && continue
            echo "::group::$plugin"
            ./build.sh "$plugin"
            ctest --test-dir "build/$plugin/Release" --output-on-failure -V
            echo "::endgroup::"
          done

      - name: Upload built Conan binaries to JFrog
        # Publish every dependency compiled above (Windows x64 MSVC binaries) so
        # later push runs and the windows-2022 release leg fetch them prebuilt.
        # Same guard as the remote-config step: never on pull requests, only on
        # this repo. No-op when the remote is not configured.
        if: github.event_name != 'pull_request' && github.repository == 'PlotJuggler/pj-official-plugins'
        shell: bash
        run: scripts/upload_conan_artifacts.sh

      - name: Dump linker response files on failure
        # A LNK1181 with a truncated .obj path points at rsp corruption; the
        # log never contains the rsp content, so surface it (plus the object
        # dir) to make the failure diagnosable without a Windows machine.
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for rsp in build/Release/CMakeFiles/*.rsp; do
            echo "===== $rsp ($(wc -c < "$rsp") bytes)"
            cat -A "$rsp" | head -60
          done
          echo "===== objects"
          ls -la build/Release/toolbox_data_exporter/CMakeFiles/*.dir/ 2>/dev/null || true

      - name: Trim Conan cache before saving
        # Drop build/source/temp trees so only recipes and package binaries
        # persist. Also forget the JFrog remote and its login token: the whole
        # ~/.conan2 tree is what gets cached, PR runs (fork PRs included) can
        # restore caches saved by main, and a credential must never travel that
        # way. Removing the remote (not just logging out) also keeps PR runs from
        # querying a server they cannot authenticate against.
        if: always() && steps.conan-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          conan remote logout plotjuggler-conan 2>/dev/null || true
          conan remote remove plotjuggler-conan 2>/dev/null || true
          conan cache clean "*" --build --source --temp || true

      - name: Save Conan cache
        # always(): a failed plugin compile must still persist the expensive
        # third-party closure. Immutable keys make a re-save a no-op, so skip
        # only on an exact-key hit.
        if: always() && steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2
          key: ${{ steps.conan_cache_key.outputs.key }}
