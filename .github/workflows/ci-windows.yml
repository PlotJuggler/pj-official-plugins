name: CI Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  push:
    branches: [main]
    paths-ignore: ['**/*.md']

concurrency:
  group: ci-windows-${{ github.ref }}
  # Cancel superseded PR runs, but QUEUE main runs: a cold main run takes hours and its
  # trailing JFrog upload + cache save keep every other run warm.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which plugins this change can affect -- see the discover-plugins job in ci-linux.yml.
  # On a Linux runner, so a change that touches no lane plugin never starts Windows.
  scope:
    runs-on: ubuntu-22.04
    outputs:
      # Windows' own plan: it also builds the aggregate when a plugin's CMake or conanfile
      # changes, the only check for a dependency missing from the root recipe or a target
      # name clash across plugins (macOS stays scoped; see scripts/ci_affected_plugins.py).
      aggregate: ${{ steps.scope.outputs.windows_aggregate }}
      standalone: ${{ steps.scope.outputs.windows_standalone }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        # Explicit bash = -o pipefail, so a script failure is not hidden behind tee.
        shell: bash
        run: python3 scripts/ci_affected_plugins.py | tee -a "$GITHUB_OUTPUT"

  build:
    needs: scope
    if: needs.scope.outputs.aggregate == 'true' || needs.scope.outputs.standalone != ''
    # Pinned: windows-latest (VS18/MSVC 14.5x) breaks the libsodium Conan recipe's source build
    # (MSB8052: default toolset 14.44 is incompatible with the v145 platform toolset its bundled
    # vs2022 solution selects). Not re-tested with libsodium/1.0.22; revert to windows-latest
    # once confirmed to build there.
    runs-on: windows-2022
    # Backstop against hangs (GitHub's default is 6 hours). A cold run rebuilds the whole
    # Conan closure from source before the cache save, so keep margin for that.
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Conan
        uses: conan-io/setup-conan@v1.3.0
        with:
          # Binaries come from the explicitly keyed Actions cache below (ConanCenter source
          # builds as fallback). Do not also use setup-conan's coarse cache: it is keyed per
          # workflow, not per dependency graph, so it misses after any change and re-saves
          # multi-GB archives it just restored.
          cache_packages: false

      - name: Install cmake and ninja
        # ninja 1.13.0 strips the leading characters of MSVC rsp lines over 16,383 chars, so
        # link.exe fails with LNK1181 on a truncated path. Pin the last good release:
        # https://github.com/ninja-build/ninja/issues/2616
        run: pip install cmake "ninja==1.11.1.4"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compute Conan cache key
        id: conan_cache_key
        shell: pwsh
        run: |
          # The runner is pinned to windows-2022, so this identity maps to one stable
          # MSVC/Release dependency graph. Key inputs: the root conanfile.py (the whole
          # third-party closure) and SDK_VERSION (the plotjuggler_sdk package ensure_core.sh
          # builds into the same cache). Bump $cacheVersion to force a cold rebuild; v2 holds
          # partial downloads saved by failed builds, so keep it out of exact and prefix restores.
          $cacheVersion = "v3"
          $combined = (Get-FileHash conanfile.py -Algorithm SHA256).Hash + (Get-FileHash SDK_VERSION -Algorithm SHA256).Hash
          $stream = [System.IO.MemoryStream]::new([System.Text.Encoding]::UTF8.GetBytes($combined))
          $fileHash = (Get-FileHash -InputStream $stream -Algorithm SHA256).Hash.Substring(0, 16).ToLower()
          "key=conan-windows-msvc-release-$cacheVersion-$fileHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "restore_prefix=conan-windows-msvc-release-$cacheVersion-" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore Conan cache
        # PR runs can restore caches published by main, so only the first run after a
        # dependency change pays the full from-source build. Prefix fallback: an older
        # closure for the same toolchain still seeds most packages.
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2
          key: ${{ steps.conan_cache_key.outputs.key }}
          restore-keys: |
            ${{ steps.conan_cache_key.outputs.restore_prefix }}

      - name: Install sccache
        # Compile cache for the plugin compilation (the Conan closure has its own cache above).
        # Not load-bearing: the build is correct without it, just slower. The outcome gate in
        # Build & Test keeps it optional if installation flakes.
        id: setup_sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"

      - name: Configure PlotJuggler JFrog Conan remote
        # Second-tier binary source behind the keyed Actions cache: on a cache miss (dependency
        # change, SDK bump, or eviction; the repo sits at the 10 GB cache limit) `conan install
        # --build=missing` pulls MSVC binaries published by the release workflow instead of
        # recompiling Arrow/boost/gRPC. Anonymous read lets PR runs (no secrets) use it
        # read-only; push runs also log in so the upload step can publish. The script falls back
        # to ConanCenter on any failure. The login token is purged before ~/.conan2 is saved
        # (see Trim).
        if: github.repository == 'PlotJuggler/pj-official-plugins'
        env:
          JFROG_USER: ${{ vars.JFROG_USER || secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        shell: bash
        run: scripts/configure_jfrog_conan.sh

      - name: Acquire plotjuggler_sdk
        # Warm run: the SDK is in the restored cache and ensure_core.sh exits immediately.
        # Cache miss: a prebuilt JFrog binary, else the pinned SDK tag built from source.
        shell: bash
        run: |
          conan profile detect --force
          scripts/ensure_core.sh

      - name: Start periodic Conan upload
        # Push runs only: publish finished packages to JFrog every 10 minutes during the build,
        # so a cancellation or timeout loses at most the package in flight. The script is
        # idempotent and no-ops when the remote is absent. The loop dies with the job.
        if: github.event_name != 'pull_request' && github.repository == 'PlotJuggler/pj-official-plugins'
        shell: bash
        run: |
          # Detach fully and redirect: a background process holding the step's
          # stdout would keep this step (and the job) waiting on it.
          nohup bash -c 'while true; do sleep 600; scripts/upload_conan_artifacts.sh || true; done' \
            > periodic_upload.log 2>&1 < /dev/null &
          echo "uploader started (pid $!)"

      - name: Build & Test
        if: needs.scope.outputs.aggregate == 'true'
        shell: bash
        env:
          SCCACHE_GHA_ENABLED: "on"
          SCCACHE_AVAILABLE: ${{ steps.setup_sccache.outcome == 'success' }}
        run: |
          # -s:b compiler.cppstd=20: the root recipe's protobuf tool_requires lives
          # in the BUILD context. protobuf 6.x needs C++17, but MSVC's default build
          # profile is cppstd=14, so its validate() rejects the package. Host -s only
          # covers the host context.
          conan install . --output-folder=build --build=missing -s build_type=Release \
            -s compiler.cppstd=20 -s:b compiler.cppstd=20 \
            -c tools.cmake.cmaketoolchain:generator=Ninja

          # Use sccache only when its install succeeded; otherwise build uncached. Only the
          # Ninja generator honors the launcher (MSBuild silently ignores it).
          launcher_args=()
          if [[ "$SCCACHE_AVAILABLE" == "true" ]]; then
            launcher_args=(-DCMAKE_C_COMPILER_LAUNCHER=sccache \
                           -DCMAKE_CXX_COMPILER_LAUNCHER=sccache)
          else
            echo "::warning::sccache unavailable; building without a compiler cache"
          fi

          cmake -S . -B build/Release -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake \
            -DCMAKE_PREFIX_PATH=build \
            -DCMAKE_BUILD_TYPE=Release \
            "${launcher_args[@]}"
          cmake --build build/Release --config Release

          if [[ "$SCCACHE_AVAILABLE" == "true" ]]; then
            sccache --show-stats
          fi

          ctest --test-dir build/Release -V --output-on-failure

      - name: Build & Test single plugins
        # The aggregate root recipe leaves out plugins whose dependency pins clash with the
        # Arrow/Flight stack (e.g. data_stream_lsl / liblsl), so a green aggregate says nothing
        # about them; they are built here, reusing the Conan cache the aggregate warmed. The
        # scope job (scripts/ci_affected_plugins.py) lists them, or exactly the affected
        # plugins on a PR that builds a subset instead of the aggregate.
        shell: bash
        env:
          SCCACHE_GHA_ENABLED: "on"
          SCCACHE_AVAILABLE: ${{ steps.setup_sccache.outcome == 'success' }}
          STANDALONE: ${{ needs.scope.outputs.standalone }}
        run: |
          # build.sh passes no compiler launcher; CMake takes it from the environment.
          if [[ "$SCCACHE_AVAILABLE" == "true" ]]; then
            export CMAKE_C_COMPILER_LAUNCHER=sccache CMAKE_CXX_COMPILER_LAUNCHER=sccache
          fi
          for plugin in $STANDALONE; do
            echo "::group::$plugin"
            ./build.sh "$plugin"
            ctest --test-dir "build/$plugin/Release" --output-on-failure -V
            echo "::endgroup::"
          done

      - name: Upload built Conan binaries to JFrog
        # Publish every dependency compiled above so later push runs and the windows-2022
        # release leg fetch them prebuilt. Never on pull requests (no secrets there, and
        # binaries from unreviewed code are never published). No-op when the remote is not
        # configured or was added anonymously.
        if: github.event_name != 'pull_request' && github.repository == 'PlotJuggler/pj-official-plugins'
        shell: bash
        run: scripts/upload_conan_artifacts.sh

      - name: Dump linker response files on failure
        # A LNK1181 with a truncated .obj path points at rsp corruption; the log never shows
        # the rsp content, so surface it (plus the object dir).
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for rsp in build/Release/CMakeFiles/*.rsp; do
            echo "===== $rsp ($(wc -c < "$rsp") bytes)"
            cat -A "$rsp" | head -60
          done
          echo "===== objects"
          ls -la build/Release/toolbox_data_exporter/CMakeFiles/*.dir/ 2>/dev/null || true

      - name: Trim Conan cache before saving
        # Drop build/source/temp trees so only recipes and package binaries persist. Also forget
        # the JFrog remote and its login token: the whole ~/.conan2 tree is cached and PR runs
        # (fork PRs included) can restore caches saved by main, so a credential must never travel
        # that way. Every run re-adds the remote via configure_jfrog_conan.sh.
        # Only after an aggregate build: single-plugin builds leave the closure incomplete.
        if: success() && steps.conan-cache.outputs.cache-hit != 'true' && needs.scope.outputs.aggregate == 'true'
        shell: bash
        run: |
          conan remote logout plotjuggler-conan 2>/dev/null || true
          conan remote remove plotjuggler-conan 2>/dev/null || true
          conan cache clean "*" --build --source --temp

      - name: Save Conan cache
        # Save only after a successful build and cleanup. A cancelled restore
        # can leave a partially extracted cache that would poison the new key.
        # Immutable keys make a re-save a no-op, so skip exact-key hits.
        if: success() && steps.conan-cache.outputs.cache-hit != 'true' && needs.scope.outputs.aggregate == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2
          key: ${{ steps.conan_cache_key.outputs.key }}
