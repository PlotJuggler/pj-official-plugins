name: pre-commit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install script test dependencies
        run: python -m pip install pytest

      - name: Test repository scripts
        run: python -m pytest scripts/tests

      - name: Check SDK feature-floor declarations
        run: python scripts/check_sdk_feature_floors.py

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
