name: pre-commit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-22.04
    env:
      PJ_SDK_ROOT: ${{ github.workspace }}/.sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read pinned SDK version
        id: sdk
        run: echo "version=$(tr -d '[:space:]' < SDK_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Checkout plotjuggler_sdk
        uses: actions/checkout@v4
        with:
          repository: PlotJuggler/plotjuggler_sdk
          ref: v${{ steps.sdk.outputs.version }}
          path: .sdk

      - name: Validate SDK pins and plugin minimums
        run: python scripts/bump_core_version.py --check

      - name: Enforce SDK feature floors
        run: python scripts/check_sdk_feature_floors.py

      - name: Test SDK minimum policy
        run: python -m unittest discover -s scripts/tests

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
