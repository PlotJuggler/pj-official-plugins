name: CI macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Apple silicon, matching the only macOS leg the release matrix still builds.
    # Intel Macs are not a supported target for the time being.
    runs-on: macos-14
    # 90, not the 60 this job carried before: it now also builds the plugins the
    # aggregate leaves out (see the step below). Recent runs land at 27-45 min, so
    # 60 left no room for the extra legs on a cold Conan cache.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Conan
        uses: conan-io/setup-conan@v1.3.0
        with:
          cache_packages: true

      - name: Install cmake and ninja
        run: pip install cmake ninja

      - name: Configure PlotJuggler JFrog Conan remote
        if: github.repository == 'PlotJuggler/pj-official-plugins'
        env:
          JFROG_USER: ${{ vars.JFROG_USER || secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        shell: bash
        run: scripts/configure_jfrog_conan.sh

      - name: Acquire plotjuggler_sdk
        # Prefer an exact JFrog binary; otherwise build from the pinned SDK
        # git tag (v<SDK_VERSION>).
        shell: bash
        run: |
          conan profile detect --force
          scripts/ensure_core.sh

      - name: Build & Test
        # build.sh, not an inline conan install: it is the path a release tag takes
        # and it carries the plugin-scoped Conan confs -- including the liblsl
        # ASIO_HAS_STD_INVOKE_RESULT define, without which liblsl does not compile
        # under libc++.
        shell: bash
        run: |
          ./build.sh
          ctest --test-dir build/all/Release -V --output-on-failure

      - name: Upload built Conan binaries to JFrog
        # Publish every dependency compiled above (macOS binaries) so the next
        # push/release run pulls them prebuilt instead of recompiling. Same guard
        # as the other upload steps: never on pull requests (no secrets there, and
        # we never publish binaries built from unreviewed code), only on this repo.
        if: github.event_name != 'pull_request' && github.repository == 'PlotJuggler/pj-official-plugins'
        shell: bash
        run: scripts/upload_conan_artifacts.sh
