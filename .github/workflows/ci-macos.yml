name: CI macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Apple silicon, matching the only macOS leg the release matrix still builds.
    # Intel Macs are not a supported target for the time being.
    runs-on: macos-14
    # 90, not the 60 this job carried before: it now also builds the plugins the
    # aggregate leaves out (see the step below). Recent runs land at 27-45 min, so
    # 60 left no room for the extra legs on a cold Conan cache.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:

      - name: Install Conan
        uses: conan-io/setup-conan@v1.3.0
        with:
          cache_packages: true

      - name: Install cmake and ninja
        run: pip install cmake ninja

      - name: Configure PlotJuggler JFrog Conan remote
        if: github.repository == 'PlotJuggler/pj-official-plugins'
        env:
          JFROG_USER: ${{ vars.JFROG_USER || secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        shell: bash
        run: scripts/configure_jfrog_conan.sh

      - name: Acquire plotjuggler_sdk
        # Prefer an exact JFrog binary; otherwise build from the pinned SDK
        # git tag (v<SDK_VERSION>).
        shell: bash
        run: |
          conan profile detect --force
          scripts/ensure_core.sh

      - name: Build & Test
        shell: bash
        run: |
          # -s:b compiler.cppstd=20: the root recipe's protobuf tool_requires lives
          # in the BUILD context. protobuf 6.x needs C++17; a default build profile
          # with a lower cppstd fails its validate(). Host -s only covers the host
          # context.
          conan install . --output-folder=build --build=missing -s build_type=Release \
            -s compiler.cppstd=20 -s:b compiler.cppstd=20 \
            -c tools.cmake.cmaketoolchain:generator=Ninja

          cmake -S . -B build/Release -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake \
            -DCMAKE_PREFIX_PATH=build \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/Release --config Release
          ctest --test-dir build/Release -V --output-on-failure

      - name: Build & Test plugins outside the aggregate
        # The aggregate root recipe above deliberately leaves out a few plugins whose
        # dependency pins clash with the Arrow/Flight stack (see the notes in
        # CMakeLists.txt and conanfile.py), so no macOS job ever compiled them.
        # ci-linux.yml already covers them via its discover-plugins matrix; macOS had no
        # equivalent, and that is how data_stream_lsl/v0.9.1 reached a published release
        # with its macos-14 leg red: liblsl only fails to build under libc++, so Linux
        # and Windows stayed green and nothing else looked at macOS until the tag.
        #
        # Discovered, not listed, matching ci-linux.yml's rule (own conanfile.py +
        # manifest.json, no release.sh -- those have their own workflow), so a new
        # out-of-aggregate plugin is covered with no workflow edit. Run inside this job
        # rather than as a separate matrix so the legs reuse the Conan cache the
        # aggregate build just warmed -- data_load_lerobot needs Arrow, which the
        # aggregate already built here via data_load_parquet.
        #
        # build.sh (not the inline conan install above) because that is the path a
        # release tag takes for a single plugin, and it carries the plugin-scoped Conan
        # confs -- including the liblsl ASIO_HAS_STD_INVOKE_RESULT define.
        shell: bash
        run: |
          for d in */conanfile.py; do
            plugin=$(dirname "$d")
            [[ -f "$plugin/release.sh" ]] && continue
            [[ -f "$plugin/manifest.json" ]] || continue
            grep -q "add_subdirectory($plugin)" CMakeLists.txt && continue
            echo "::group::$plugin"
            ./build.sh "$plugin"
            ctest --test-dir "build/$plugin/Release" --output-on-failure -V
            echo "::endgroup::"
          done

      - name: Upload built Conan binaries to JFrog
        # Publish every dependency compiled above (macOS binaries) so the next
        # push/release run pulls them prebuilt instead of recompiling. Same guard
        # as the other upload steps: never on pull requests (no secrets there, and
        # we never publish binaries built from unreviewed code), only on this repo.
        if: github.event_name != 'pull_request' && github.repository == 'PlotJuggler/pj-official-plugins'
        shell: bash
        run: scripts/upload_conan_artifacts.sh
