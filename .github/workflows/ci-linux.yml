name: CI Linux

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  push:
    branches: [main]
    paths-ignore: ['**/*.md']

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Acquire plotjuggler_sdk once per run (JFrog first, else ensure_core.sh builds the
  # v<SDK_VERSION> tag) and hand it to every build leg as a Conan cache artifact.
  acquire-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Conan
        uses: conan-io/setup-conan@v1.3.0
        with:
          cache_packages: true

      - name: Install cmake and ninja
        run: pip install cmake ninja

      - name: Detect Conan profile
        shell: bash
        run: conan profile detect --force

      - name: Configure PlotJuggler JFrog Conan remote
        if: github.repository == 'PlotJuggler/pj-official-plugins'
        env:
          JFROG_USER: ${{ vars.JFROG_USER || secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        shell: bash
        run: scripts/configure_jfrog_conan.sh

      - name: Acquire plotjuggler_sdk (JFrog → source fallback)
        shell: bash
        run: scripts/ensure_core.sh

      - name: Upload plotjuggler_sdk to JFrog
        # When ensure_core.sh built the SDK from source (no JFrog binary), publish it so the
        # next run fetches it prebuilt. No-op if it came from JFrog.
        if: github.event_name != 'pull_request' && github.repository == 'PlotJuggler/pj-official-plugins'
        shell: bash
        run: scripts/upload_conan_artifacts.sh "plotjuggler_sdk/$(cat SDK_VERSION)"

      - name: Save plotjuggler_sdk to a Conan cache artifact
        # Pin to the exact SDK_VERSION so a stale plotjuggler_sdk left in the
        # setup-conan package cache can never be shipped in the artifact.
        shell: bash
        run: conan cache save "plotjuggler_sdk/$(cat SDK_VERSION):*" --file core-cache.tgz

      - name: Upload core cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: conan-core-cache
          path: core-cache.tgz
          if-no-files-found: error
          retention-days: 1

  # Build every Arrow variant once per run (JFrog first) and hand them to the arrow-consuming
  # plugins as one Conan cache artifact, instead of compiling Arrow (+ boost/grpc/protobuf)
  # in each plugin leg. Arrow's package_id depends on its options, so three variants are primed:
  #   * parquet/snappy: data_load_parquet, data_load_lerobot (~14 min)
  #   * + lz4/zstd: parser_arrow (compressed IPC)
  #   * + Flight/grpc/protobuf: toolbox_mosaico (~50 min)
  # Each leg restores the "*:*" artifact and Conan picks the matching package_id.
  #
  # Builds run in an ISOLATED CONAN_HOME so the saved closure is exactly Arrow + its
  # from-source deps and never a stale plotjuggler_sdk from the shared setup-conan cache.
  # The actions/cache key encodes the exact Arrow config (cache keys are immutable).
  acquire-arrow:
    needs: discover-plugins
    if: needs.discover-plugins.outputs.arrow_plugins != '[]'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan-arrow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Conan
        uses: conan-io/setup-conan@v1.3.0
        with:
          # Own precisely-keyed cache below; the shared setup-conan key would pollute the
          # isolated home.
          cache_packages: false

      - name: Install cmake and ninja
        run: pip install cmake ninja

      - name: Restore the Arrow build cache
        id: arrow-cache
        uses: actions/cache@v4
        with:
          # Cache packages only. Conan stores remote credentials elsewhere in
          # CONAN_HOME, so no JFrog token is persisted in an Actions cache.
          path: ${{ github.workspace }}/.conan-arrow/p
          # Bump the trailing -vN whenever an Arrow option set below changes, so a
          # stale immutable entry can't pin an old binary.
          key: conan-arrow-26.0.1-cppstd20-parquet-flight-${{ runner.os }}-v3

      - name: Configure PlotJuggler JFrog Conan remote
        if: github.repository == 'PlotJuggler/pj-official-plugins'
        env:
          JFROG_USER: ${{ vars.JFROG_USER || secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        shell: bash
        run: scripts/configure_jfrog_conan.sh

      - name: Build the Arrow variants (no-op on a cache hit)
        shell: bash
        # Each variant's options MUST match the consuming recipe's default_options so the
        # package_id is identical and the build legs reuse the binary (check with
        # `conan graph info`).
        run: |
          conan profile detect --force
          # Variant 1 — parquet/snappy (data_load_parquet, data_load_lerobot).
          conan install --requires=arrow/26.0.1 \
            -o "arrow/*:parquet=True" -o "arrow/*:with_snappy=True" -o "arrow/*:with_mimalloc=False" \
            -o "*:shared=False" \
            -o "boost/*:without_test=True" -o "boost/*:without_cobalt=True" \
            -s build_type=Release -s compiler.cppstd=20 \
            -c tools.cmake.cmaketoolchain:generator=Ninja \
            --build=missing -of "$(mktemp -d)"
          # Variant 2 — IPC decoding (parser_arrow): parquet with LZ4/ZSTD.
          conan install --requires=arrow/26.0.1 \
            -o "arrow/*:parquet=True" -o "arrow/*:with_snappy=True" -o "arrow/*:with_mimalloc=False" \
            -o "arrow/*:with_lz4=True" -o "arrow/*:with_zstd=True" \
            -o "*:shared=False" \
            -o "boost/*:without_test=True" -o "boost/*:without_cobalt=True" \
            -s build_type=Release -s compiler.cppstd=20 \
            -c tools.cmake.cmaketoolchain:generator=Ninja \
            --build=missing -of "$(mktemp -d)"
          # Variant 3 — Arrow Flight (toolbox_mosaico); lz4/zstd because the Mosaico server
          # sends LZ4/ZSTD batches.
          conan install --requires=arrow/26.0.1 \
            -o "arrow/*:parquet=True" -o "arrow/*:with_snappy=True" -o "arrow/*:with_mimalloc=False" \
            -o "arrow/*:with_flight_rpc=True" -o "arrow/*:with_grpc=True" \
            -o "arrow/*:with_protobuf=True" -o "arrow/*:with_re2=True" \
            -o "arrow/*:with_thrift=True" \
            -o "arrow/*:with_lz4=True" -o "arrow/*:with_zstd=True" \
            -o "*:shared=False" \
            -o "boost/*:without_test=True" -o "boost/*:without_cobalt=True" \
            -s build_type=Release -s compiler.cppstd=20 \
            -c tools.cmake.cmaketoolchain:generator=Ninja \
            --build=missing -of "$(mktemp -d)"

      - name: Upload the Arrow closure to JFrog
        # The isolated CONAN_HOME holds only the Arrow closure, so "*" publishes exactly that,
        # priming JFrog so future runs skip the ~50 min Flight build. Idempotent.
        if: github.event_name != 'pull_request' && github.repository == 'PlotJuggler/pj-official-plugins'
        shell: bash
        run: scripts/upload_conan_artifacts.sh

      - name: Pack the Arrow closure for the build legs
        shell: bash
        # The isolated home never holds plotjuggler_sdk, so saving everything is safe.
        run: conan cache save "*:*" --file "$GITHUB_WORKSPACE/arrow-cache.tgz"

      - name: Upload Arrow cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: conan-arrow-cache
          path: arrow-cache.tgz
          if-no-files-found: error
          retention-days: 1

  # Matrix of plugins to build in isolation. On a pull request: only those the change can
  # affect (scripts/ci_affected_plugins.py: changed plugin dirs plus consumers of a changed
  # common/ library; any other path selects everything). Pushes to main and manual runs
  # build every plugin, keeping badges, JFrog uploads and the post-merge safety net complete.
  discover-plugins:
    runs-on: ubuntu-22.04
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
      arrow_plugins: ${{ steps.list.outputs.arrow_plugins }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A PR run checks out GitHub's merge commit, whose first parent is the base:
          # these two commits are all `git diff HEAD^1 HEAD` needs.
          fetch-depth: 2

      - name: List plugins
        id: list
        # Arrow consumers build in arrow-plugin-build, reusing the Arrow binary from
        # acquire-arrow. The script splits them by recipe content ("arrow/"), so a new Arrow
        # plugin needs no workflow edit. A variant acquire-arrow does not prime still works:
        # it is rebuilt in-leg.
        # Explicit bash = -o pipefail, so a script failure is not hidden behind tee.
        shell: bash
        run: python3 scripts/ci_affected_plugins.py | tee -a "$GITHUB_OUTPUT"

  # Build each plugin in isolation against its own conanfile.py (the path the release
  # workflow takes) to catch per-plugin recipe gaps. plotjuggler_sdk comes from the
  # acquire-core artifact.
  per-plugin-build:
    needs: [discover-plugins, acquire-core]
    if: needs.discover-plugins.outputs.plugins != '[]'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.discover-plugins.outputs.plugins) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Conan
        uses: conan-io/setup-conan@v1.3.0
        with:
          cache_packages: true

      - name: Install cmake and ninja
        run: pip install cmake ninja

      - name: Detect Conan profile
        shell: bash
        run: conan profile detect --force

      - name: Configure PlotJuggler JFrog Conan remote
        if: github.repository == 'PlotJuggler/pj-official-plugins'
        env:
          JFROG_USER: ${{ vars.JFROG_USER || secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        shell: bash
        run: scripts/configure_jfrog_conan.sh

      - name: Download core cache artifact
        uses: actions/download-artifact@v4
        with:
          name: conan-core-cache

      - name: Restore plotjuggler_sdk into the Conan cache
        # On a restore miss, ensure_core.sh retries JFrog before building from source.
        shell: bash
        run: conan cache restore core-cache.tgz || scripts/ensure_core.sh

      - name: Build ${{ matrix.plugin }}
        shell: bash
        run: ./build.sh "${{ matrix.plugin }}"

      - name: Test ${{ matrix.plugin }}
        shell: bash
        run: ctest --test-dir "build/${{ matrix.plugin }}/Release" --output-on-failure -V

      - name: Upload built Conan binaries to JFrog
        # Publish this plugin's dependency binaries so later runs fetch them prebuilt.
        # Overlapping uploads from parallel legs are safe: Conan skips present revisions.
        if: github.event_name != 'pull_request' && github.repository == 'PlotJuggler/pj-official-plugins'
        shell: bash
        run: scripts/upload_conan_artifacts.sh

      # Badge JSON for the update-badges job; `always()` so a failed build reports red
      # instead of going stale.
      - name: Write status badge JSON
        if: always()
        shell: bash
        run: |
          python3 scripts/write_badge_json.py \
            --plugin "${{ matrix.plugin }}" \
            --status "${{ job.status }}" \
            --out-dir badge-out

      - name: Upload status badge JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badge-${{ matrix.plugin }}
          path: badge-out/${{ matrix.plugin }}.json
          if-no-files-found: error
          retention-days: 1

  # Same as per-plugin-build for the Arrow consumers, plus the restore of the acquire-arrow
  # closure, so Arrow + boost compile once per run instead of once per plugin. Each plugin is
  # still installed against its own recipe (only built binaries are shared).
  arrow-plugin-build:
    needs: [discover-plugins, acquire-core, acquire-arrow]
    if: needs.discover-plugins.outputs.arrow_plugins != '[]'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.discover-plugins.outputs.arrow_plugins) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Conan
        uses: conan-io/setup-conan@v1.3.0
        with:
          cache_packages: true

      - name: Install cmake and ninja
        run: pip install cmake ninja

      - name: Detect Conan profile
        shell: bash
        run: conan profile detect --force

      - name: Configure PlotJuggler JFrog Conan remote
        if: github.repository == 'PlotJuggler/pj-official-plugins'
        env:
          JFROG_USER: ${{ vars.JFROG_USER || secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        shell: bash
        run: scripts/configure_jfrog_conan.sh

      - name: Download core cache artifact
        uses: actions/download-artifact@v4
        with:
          name: conan-core-cache

      - name: Download Arrow cache artifact
        uses: actions/download-artifact@v4
        with:
          name: conan-arrow-cache

      - name: Restore plotjuggler_sdk and Arrow into the Conan cache
        # With the Arrow binary present at a matching package_id, build.sh's `--build=missing`
        # reuses it; an Arrow-restore miss falls back to building Arrow in this leg.
        # ensure_core.sh covers a core-restore miss.
        shell: bash
        run: |
          conan cache restore core-cache.tgz || scripts/ensure_core.sh
          conan cache restore arrow-cache.tgz || true

      - name: Build ${{ matrix.plugin }}
        shell: bash
        run: ./build.sh "${{ matrix.plugin }}"

      - name: Test ${{ matrix.plugin }}
        shell: bash
        run: ctest --test-dir "build/${{ matrix.plugin }}/Release" --output-on-failure -V

      - name: Upload built Conan binaries to JFrog
        # Publish this plugin's dependency binaries (Arrow was primed by acquire-arrow).
        if: github.event_name != 'pull_request' && github.repository == 'PlotJuggler/pj-official-plugins'
        shell: bash
        run: scripts/upload_conan_artifacts.sh

      - name: Write status badge JSON
        if: always()
        shell: bash
        run: |
          python3 scripts/write_badge_json.py \
            --plugin "${{ matrix.plugin }}" \
            --status "${{ job.status }}" \
            --out-dir badge-out

      - name: Upload status badge JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badge-${{ matrix.plugin }}
          path: badge-out/${{ matrix.plugin }}.json
          if-no-files-found: error
          retention-days: 1

  # Publish per-plugin status badges to the orphan `badges` branch read by the README's
  # shields.io badges. A single committer, so parallel legs never race on `git push`. Pushes
  # to main only, so badges track main's health; `always()` so red builds publish a red badge.
  update-badges:
    name: update status badges
    needs: [discover-plugins, per-plugin-build, arrow-plugin-build]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: badges-branch
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download badge JSON artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: badge-*
          path: badge-out
          merge-multiple: true

      - name: Publish badges
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: scripts/publish_badges.sh badge-out
