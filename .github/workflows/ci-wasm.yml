name: CI WASM

# Builds PlotJuggler's browser app (its own WebAssembly build, not a copy of it) against this
# checkout's plugins, through their wasm.cmake files (README "WebAssembly build"). The app links
# every plugin into one module, so this also catches a duplicate symbol between plugins or with
# the host. No packaging, browser tests or size gate: PlotJuggler's own WASM CI runs those.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/wasm.cmake'
      - 'cmake/PjWasmPlugin.cmake'
      - 'cmake/EmbedManifest.cmake'
      - 'cmake/EmbedUi.cmake'
      - 'common/**'
      # The plugins PlotJuggler's PJ_WASM_OFFICIAL_PLUGIN_DIRS lists.
      - 'data_load_3d/**'
      - 'data_load_blf/**'
      - 'data_load_candump/**'
      - 'data_load_csv/**'
      - 'data_load_mcap/**'
      - 'data_load_mf4/**'
      - 'data_load_parquet/**'
      - 'data_load_ulog/**'
      - 'data_stream_dummy/**'
      - 'data_stream_pj_bridge/**'
      - 'parser_arrow/**'
      - 'parser_data_tamer/**'
      - 'parser_influx/**'
      - 'parser_json/**'
      - 'parser_navmap/**'
      - 'parser_protobuf/**'
      - 'parser_ros/**'
      - 'toolbox_anomaly_detector/**'
      - 'toolbox_data_exporter/**'
      - 'toolbox_fft/**'
      - 'toolbox_quaternion/**'
      - 'toolbox_transform_editor/**'
      - 'widget_log/**'
      - '.github/workflows/ci-wasm.yml'
  push:
    branches: [main]

concurrency:
  group: ci-wasm-${{ github.ref }}
  cancel-in-progress: true

env:
  # The PlotJuggler commit whose browser build this job runs: the one place the host is pinned.
  # It must consume the per-plugin wasm.cmake files: until the PlotJuggler PR that introduced
  # them (PlotJuggler/PlotJuggler, branch refactor/wasm-official-plugin-function) merges, a commit
  # of that PR; afterwards a commit of PlotJuggler's main. A commit, not a branch, so the job
  # does not break when the host moves.
  PJ_HOST_REF: a4e6ac30885443a80169ff49e196d532086732bd

jobs:
  wasm:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Free disk space
        # The toolchains, the host's fetched dependencies and its build take about 10 GB.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Use HTTPS for github.com submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout plugins
        uses: actions/checkout@v4
        with:
          path: plugins

      - name: Checkout PlotJuggler
        uses: actions/checkout@v4
        with:
          repository: PlotJuggler/PlotJuggler
          ref: ${{ env.PJ_HOST_REF }}
          path: host
          submodules: recursive

      - name: Read the host's toolchain versions
        id: versions
        run: |
          set -euo pipefail
          source host/versions.env
          for name in PJ_QT_VERSION PJ_EMSCRIPTEN_VERSION PJ_WASM_NODE_VERSION; do
            echo "${name}=${!name}" >> "${GITHUB_ENV}"
          done
          echo "qt=${PJ_QT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "emscripten=${PJ_EMSCRIPTEN_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "node=${PJ_WASM_NODE_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install node (the host's CPython build runs it)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache ninja-build python3-pip make patch pkg-config
          # Scene2D video cross-compiles dav1d, whose build system is meson.
          python3 -m pip install --user meson
          # The host Qt's qsb (offline shader baking) loads the Qt GUI stack even headless.
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libfontconfig1 libfreetype6 libxkbcommon0 \
            libx11-6 libxcb1 libglib2.0-0 libdbus-1-3

      - name: Cache Qt WebAssembly and host kits
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ~/.qt-wasm
          key: qt-wasm-${{ steps.versions.outputs.qt }}-multithread-shadertools-v1

      - name: Install Qt WebAssembly and host kits
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python3 -m pip install --user 'aqtinstall==3.3.0'
          "${HOME}/.local/bin/aqt" install-qt linux desktop "${PJ_QT_VERSION}" linux_gcc_64 \
            --outputdir ~/.qt-wasm -m qtshadertools
          "${HOME}/.local/bin/aqt" install-qt all_os wasm "${PJ_QT_VERSION}" wasm_multithread \
            --outputdir ~/.qt-wasm -m qtshadertools

      - name: Cache Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/.emsdk
          key: emsdk-${{ steps.versions.outputs.emscripten }}-linux-x64-v1

      - name: Install Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${PJ_EMSCRIPTEN_VERSION}" https://github.com/emscripten-core/emsdk.git ~/.emsdk
          ~/.emsdk/emsdk install "${PJ_EMSCRIPTEN_VERSION}"
          ~/.emsdk/emsdk activate "${PJ_EMSCRIPTEN_VERSION}"

      - name: Cache the host's WebAssembly CPython build
        uses: actions/cache@v4
        with:
          path: ~/.cache/pj-wasm-cpython
          key: wasm-cpython-${{ hashFiles('host/cmake/PjWasmPython.cmake', 'host/cmake/wasm_python/**') }}-emsdk-${{ steps.versions.outputs.emscripten }}

      - name: Restore compiler cache
        # Saved only by pushes to main (below): this repository's Actions cache is at its 10 GB
        # cap, and a PR's entry is visible to that PR alone, so saving one per PR run would evict
        # the other workflows' caches. PRs start from main's latest entry.
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-wasm-${{ github.run_id }}
          restore-keys: ccache-wasm-

      - name: Configure compiler cache
        run: |
          # A cold build of the whole app stores about 0.11 GB (compressed).
          ccache --set-config=max_size=1G
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --set-config=hash_dir=false
          ccache --set-config=base_dir="${GITHUB_WORKSPACE}"
          ccache --zero-stats

      - name: Build the browser app against these plugins
        run: |
          set -euo pipefail
          source ~/.emsdk/emsdk_env.sh >/dev/null
          # Scene2D resolves Emscripten's sysroot zlib port; build it before configuring.
          embuilder build zlib
          cmake -S host -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${HOME}/.qt-wasm/${PJ_QT_VERSION}/wasm_multithread/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="${HOME}/.qt-wasm/${PJ_QT_VERSION}/gcc_64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPJ_BUILD_TESTS=OFF \
            -DPJ_BUILD_DEMOS=OFF \
            -DPJ_WASM_PYTHON_CACHE_DIR="${HOME}/.cache/pj-wasm-cpython" \
            -DFETCHCONTENT_SOURCE_DIR_PJ_OFFICIAL_PLUGINS="${GITHUB_WORKSPACE}/plugins"
          cmake --build build --target pj_app --parallel 4

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save compiler cache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-wasm-${{ github.run_id }}
