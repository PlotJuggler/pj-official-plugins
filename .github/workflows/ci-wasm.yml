name: CI WASM

# Builds PlotJuggler's browser app (its own WebAssembly build, not a copy of it) against this
# checkout's plugins, through their wasm.cmake files (README "WebAssembly build"). The app links
# every plugin into one module, so this also catches a duplicate strong symbol between plugins or
# with the host (the link runs without the host's Qt flush override, the one part of it built
# with --allow-multiple-definition). No packaging, browser tests or size gate: PlotJuggler's own WASM CI runs those.

# Any change can reach the browser build (a plugin's sources, common/, cmake/, LICENSE), so
# only docs and native tests are skipped, rather than keeping a second copy of the host's list.
on:
  workflow_dispatch:
  pull_request:
    paths-ignore: &skip
      - '**/*.md'
      - '**/tests/**'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore: *skip

concurrency:
  group: ci-wasm-${{ github.ref }}
  cancel-in-progress: true

env:
  # The PlotJuggler commit whose browser build this job runs (README "WebAssembly build"): a
  # commit, not a branch, so the job does not break when the host moves.
  PJ_HOST_REF: 840bfc82613af25487ec677c5255c35ea469ef78

jobs:
  wasm:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Free disk space
        # The toolchains, the host's fetched dependencies and its build take about 10 GB.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Use HTTPS for github.com submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout plugins
        uses: actions/checkout@v4
        with:
          path: plugins

      - name: Checkout PlotJuggler
        uses: actions/checkout@v4
        with:
          repository: PlotJuggler/PlotJuggler
          ref: ${{ env.PJ_HOST_REF }}
          path: host
          submodules: recursive

      - name: Read the host's toolchain versions
        run: |
          set -euo pipefail
          source host/versions.env
          for name in PJ_QT_VERSION PJ_EMSCRIPTEN_VERSION PJ_WASM_NODE_VERSION; do
            echo "${name}=${!name}" >> "${GITHUB_ENV}"
          done

      - name: Install node (the host's CPython build runs it)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PJ_WASM_NODE_VERSION }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache ninja-build python3-pip make patch pkg-config
          # Scene2D video cross-compiles dav1d, whose build system is meson.
          python3 -m pip install --user meson
          # The host Qt's qsb (offline shader baking) loads the Qt GUI stack even headless.
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libfontconfig1 libfreetype6 libxkbcommon0 \
            libx11-6 libxcb1 libglib2.0-0 libdbus-1-3

      - name: Restore Qt WebAssembly and host kits
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.qt-wasm
          key: qt-wasm-${{ env.PJ_QT_VERSION }}-multithread-shadertools-v1

      - name: Install Qt WebAssembly and host kits
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python3 -m pip install --user 'aqtinstall==3.3.0'
          "${HOME}/.local/bin/aqt" install-qt linux desktop "${PJ_QT_VERSION}" linux_gcc_64 \
            --outputdir ~/.qt-wasm -m qtshadertools
          "${HOME}/.local/bin/aqt" install-qt all_os wasm "${PJ_QT_VERSION}" wasm_multithread \
            --outputdir ~/.qt-wasm -m qtshadertools

      - name: Restore Emscripten SDK
        id: emsdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.emsdk
          key: emsdk-${{ env.PJ_EMSCRIPTEN_VERSION }}-linux-x64-v1

      - name: Install Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${PJ_EMSCRIPTEN_VERSION}" https://github.com/emscripten-core/emsdk.git ~/.emsdk
          ~/.emsdk/emsdk install "${PJ_EMSCRIPTEN_VERSION}"
          ~/.emsdk/emsdk activate "${PJ_EMSCRIPTEN_VERSION}"

      - name: Restore the host's WebAssembly CPython build
        id: cpython-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pj-wasm-cpython
          key: wasm-cpython-${{ hashFiles('host/cmake/PjWasmPython.cmake', 'host/cmake/wasm_python/**') }}-emsdk-${{ env.PJ_EMSCRIPTEN_VERSION }}

      - name: Restore compiler cache
        # Every cache here is saved only by pushes to main (the last steps): this repository's
        # Actions cache is at its 10 GB cap, and a PR's entry is visible to that PR alone, so
        # saving one per PR run would evict the other workflows' caches. The Emscripten version
        # is in the key because ccache cannot tell its releases apart (em++ is the same launcher).
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-wasm-${{ env.PJ_EMSCRIPTEN_VERSION }}-${{ github.run_id }}
          restore-keys: ccache-wasm-${{ env.PJ_EMSCRIPTEN_VERSION }}-

      - name: Configure compiler cache
        run: |
          # A cold build of the whole app stores about 0.11 GB (compressed); the cap keeps dead
          # objects from piling up across saved entries.
          ccache --set-config=max_size=400M
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --set-config=hash_dir=false
          ccache --set-config=base_dir="${GITHUB_WORKSPACE}"
          ccache --zero-stats

      - name: Build the browser app against these plugins
        run: |
          set -euo pipefail
          source ~/.emsdk/emsdk_env.sh >/dev/null
          # Scene2D resolves Emscripten's sysroot zlib port; build it before configuring.
          embuilder build zlib
          cmake -S host -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${HOME}/.qt-wasm/${PJ_QT_VERSION}/wasm_multithread/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="${HOME}/.qt-wasm/${PJ_QT_VERSION}/gcc_64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPJ_BUILD_TESTS=OFF \
            -DPJ_BUILD_DEMOS=OFF \
            -DPJ_WASM_PYTHON_CACHE_DIR="${HOME}/.cache/pj-wasm-cpython" \
            -DPJ_WASM_QT_FLUSH_OVERRIDE=OFF \
            -DFETCHCONTENT_SOURCE_DIR_PJ_OFFICIAL_PLUGINS="${GITHUB_WORKSPACE}/plugins"
          cmake --build build --target pj_app --parallel 4

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save Qt WebAssembly and host kits
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.qt-wasm
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      - name: Save Emscripten SDK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.emsdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.emsdk
          key: ${{ steps.emsdk-cache.outputs.cache-primary-key }}

      - name: Save the host's WebAssembly CPython build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cpython-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pj-wasm-cpython
          key: ${{ steps.cpython-cache.outputs.cache-primary-key }}

      - name: Save compiler cache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
