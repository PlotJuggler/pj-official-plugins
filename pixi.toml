[workspace]
name = "pj-official-plugins"
channels = ["conda-forge", "https://prefix.dev/plotjuggler"]
platforms = ["linux-64"]

[dependencies]
cmake = ">=3.22"
ninja = "*"
cxx-compiler = "*"
# CRITICAL: conda libstdcxx 15 references __libc_single_threaded (glibc 2.32+);
# the default sysroot 2.28 lacks it -> message-parser plugins fail to link.
sysroot_linux-64 = ">=2.34"
plotjuggler_sdk = "0.8.*"
gtest = "1.17.*"
nlohmann_json = "3.12.*"

[feature.datetime.dependencies]
howardhinnant_date = "3.0.*"
[feature.serialization.dependencies]
libarrow = ">=23,<24"
libparquet = ">=23,<24"
[feature.compression.dependencies]
zstd = "1.5.*"
lz4-c = "1.10.*"
[feature.protobuf.dependencies]
libprotobuf = "6.33.*"
protobuf = "6.33.*"
[feature.mqtt.dependencies]
paho-mqtt-cpp = ">=1.6,<1.7"
[feature.zmq.dependencies]
cppzmq = "4.11.*"
zeromq = "4.3.*"
libsodium = ">=1.0.20"
[feature.udp.dependencies]
asio = ">=1.28"
[feature.scripting.dependencies]
lua = ">=5.4,<5.5"
sol2 = "3.5.*"
# foxglove_bridge + pj_bridge: this SDK port replaced the original's Qt WebSockets
# with ixwebsocket (no Qt at build — the .ui is embedded as a constexpr char[] by
# pj_embed_ui). conda-forge ships ixwebsocket 11.4.6 with the same
# ixwebsocket::ixwebsocket target Conan uses, so no normalization helper is needed.
[feature.bridge.dependencies]
ixwebsocket = "11.4.*"

[environments]
default = { features = ["datetime", "serialization", "compression", "protobuf", "mqtt", "zmq", "udp", "scripting", "bridge"], solve-group = "main" }

[tasks]
plugin = "cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DPJ_BUILD_PLUGIN=$PJ_PLUGIN && cmake --build build && ctest --test-dir build --output-on-failure"
